services:
  apex-portal:
    build:
      context: ./apex-pq
      dockerfile: Dockerfile
    container_name: apex-identity-portal
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APEX_DEMO_MODE=1
      - FLASK_ENV=production
      - SECRET_KEY=b3a5b8214fbc9048a1c8f192b73a38-apex-pqc
    volumes:
      - ./apex-pq/pqc-identity/db:/app/db
      - ./apex-pq/pqc-identity/wallet-extension/seeds.json:/app/wallet-extension/seeds.json

  zest-suites:
    build:
      context: ./zest-suites
      dockerfile: Dockerfile
    container_name: zest-suites-portal
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
